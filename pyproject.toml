[tool.poetry]
name = "t_res"
version = "0.1.0"
description = ""
authors = ["Federico Nanni <nanni.federico@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.9, <3.11"
tqdm = "^4.62.3"
bs4 = "^0.0.1"
pandas = "^1.3.4"
wget = "^3.2"
DeezyMatch = "^1.3.4"
datasets = "^1.18.0"
transformers = ">=4.16.1, <=4.40.2"
pydash = "^5.1.0"
wikimapper = "^0.1.5"
numpy = "^1.22.1"
scikit-learn = "^1.0.2"
docopt = "^0.6.2"
seqeval = "^1.2.2"
requests = "^2.27.1"
pandarallel = "^1.6.1"
pyxDamerauLevenshtein = "^1.7.0"
anyascii = "^0.3.1"
colorama = "^0.4.4"
nltk = "^3.7"
flair = "0.10"
networkx = "^2.8.4"
thefuzz = "^0.19.0"
sentence-splitter = "^1.4"
haversine = "^2.7.0"
fastapi = "^0.87.0"
uvicorn = {extras = ["standard"], version = "^0.20.0"}
ipykernel = "^6.21.3"
python-levenshtein = "^0.20.9"
torch = "^1.13.1"
accelerate = "^0.27.2"
scipy = "^1.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7"
jupyter = "^1.0.0"
black = "^22.3.0"
flake8 = "^6.0.0"
isort = "^5.12.0"
pre-commit = "^3.3.1"

[tool.poetry.group.docs.dependencies]
Sphinx = "^5.0.0"
sphinx-rtd-theme = "^1.0.0"
sphinxcontrib-napoleon = "^0.7"
sphinx-copybutton = "^0.5.2"
mkdocs-material = "^9.5.49"
mkdocs-include-markdown-plugin= "^6.0.4"
mkdocs-exclude = "^1.0.2"
mkdocs-macros-plugin = "^1.0.4"
mkdocs-awesome-pages-plugin = "^2.10.1"
mkdocstrings-python = "^1.12.2"

[tool.poetry.scripts]
batch-job = "t_res.utils.batch_job:run"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
include = '\.pyi?$'

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
markers = [
    "resources: tests which depend on files in the resources directory",
    "train: tests which train a model",
    "app: tests which require access to the HTTP API",
]
